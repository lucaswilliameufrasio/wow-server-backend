services:
  app-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${WOW_PG_DB:-wow_app}
      POSTGRES_USER: ${WOW_PG_USER:-wow_api}
      POSTGRES_PASSWORD: ${WOW_PG_PASSWORD:?Set WOW_PG_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wow_pg_data:/var/lib/postgresql
    networks:
      - wow-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WOW_PG_USER:-wow_api}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s

  wow-backend:
    image: ${WOW_BACKEND_IMAGE:-ghcr.io/lucaswilliameufrasio/wow-server-backend}:${WOW_BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile.production
    ports:
      - "127.0.0.1:${WOW_API_PORT:-3000}:${WOW_API_PORT:-3000}"
    environment:
      AZEROTH_CORE_MYSQL_DATABASE_URL: mysql://${WOW_MYSQL_USER:-root}:${WOW_MYSQL_PASSWORD}@ac-database:3306
      AZEROTH_CORE_AUTH_DB: acore_auth
      AZEROTH_CORE_CHARACTERS_DB: acore_characters
      AZEROTH_CORE_WORLD_DB: acore_world
      APP_POSTGRES_DATABASE_URL: postgres://${WOW_PG_USER:-wow_api}:${WOW_PG_PASSWORD}@app-postgres:5432/${WOW_PG_DB:-wow_app}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${WOW_JWT_ISSUER:-wow-backend}
      JWT_AUDIENCE: ${WOW_JWT_AUDIENCE:-wow-web}
      JWT_EXPIRES_MINUTES: ${WOW_JWT_EXPIRES_MINUTES:-15}
      JWT_REFRESH_EXPIRES_DAYS: ${WOW_JWT_REFRESH_EXPIRES_DAYS:-30}
      SRP6_CORE5_MODE: ${WOW_SRP6_CORE5_MODE:-false}
      PORT: ${WOW_API_PORT:-3000}
      METRICS_PORT: ${WOW_METRICS_PORT:-9090}
      METRICS_BIND: 0.0.0.0
      AZEROTH_CORE_SOAP_HOST: ac-worldserver
      AZEROTH_CORE_SOAP_PORT: ${WOW_SOAP_PORT:-7878}
      AZEROTH_CORE_SOAP_USER: ${WOW_SOAP_USER:-wowctl}
      AZEROTH_CORE_SOAP_PASSWORD: ${WOW_SOAP_PASSWORD:-}
      WOW_ENABLE_GM_COMMANDS: ${WOW_ENABLE_GM_COMMANDS:-false}
      RUST_LOG: ${WOW_RUST_LOG:-info}
      # Optional: worldserver log tail endpoints (/v1/admin/server/logs|crashes).
      # Uncomment both this env and the volume below, pointing WOW_ACORE_LOGS_DIR
      # at the host directory that holds Server.log/Crash.log.
      # AZEROTH_CORE_LOGS_DIR: /logs/acore
    secrets:
      - source: jwt_private
        target: jwt_private.pem
      - source: jwt_public
        target: jwt_public.pem
    # volumes:
    #   - ${WOW_ACORE_LOGS_DIR:?Set WOW_ACORE_LOGS_DIR}:/logs/acore:ro
    networks:
      - wow-shared
      - wow-acore
    depends_on:
      app-postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${WOW_API_PORT:-3000}/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional scheduled backup (enabled when WOW_BACKUP_SCHEDULE is set, e.g. "0 3 * * *").
  wow-backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      WOW_PG_USER: ${WOW_PG_USER:-wow_api}
      WOW_PG_PASSWORD: ${WOW_PG_PASSWORD:-}
      WOW_MYSQL_PASSWORD: ${WOW_MYSQL_PASSWORD:-}
      WOW_BACKUP_RETENTION_DAYS: ${WOW_BACKUP_RETENTION_DAYS:-30}
      WOW_BACKUP_SCHEDULE: ${WOW_BACKUP_SCHEDULE:-0 3 * * *}
    volumes:
      - ./wow-backup.sh:/usr/local/bin/wow-backup.sh:ro
      - wow_backup_data:/backups
    networks:
      - wow-shared
      - wow-acore
    depends_on:
      app-postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache mysql-client >/dev/null 2>&1 || true
        echo "$${WOW_BACKUP_SCHEDULE} root /usr/local/bin/wow-backup.sh >> /var/log/wow-backup.log 2>&1" > /etc/crontabs/root
        echo "[backup] cron scheduled: $${WOW_BACKUP_SCHEDULE}"
        touch /var/log/wow-backup.log
        crond -f

networks:
  wow-shared:
    name: wow-shared
  wow-acore:
    name: ${WOW_ACORE_NETWORK:-azerothcore-wotlk_ac-network}
    external: true

secrets:
  jwt_private:
    file: ${WOW_JWT_PRIVATE_FILE:-../../.secrets/jwt_private.pem}
  jwt_public:
    file: ${WOW_JWT_PUBLIC_FILE:-../../.secrets/jwt_public.pem}

volumes:
  wow_pg_data:
  wow_backup_data:
