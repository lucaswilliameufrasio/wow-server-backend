name: Manage WoW Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação (start, stop, status)'
        required: true
        default: status
        type: choice
        options:
          - status
          - start
          - stop

concurrency:
  group: wow-server
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.WOW_VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.WOW_VPS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Run action
        run: |
          set -euo pipefail
          ACTION="${{ github.event.inputs.action }}"
          TARGET="${{ secrets.WOW_VPS_SSH_USER }}@${{ secrets.WOW_VPS_SSH_HOST }}"
          VPS_DIR="${{ secrets.WOW_VPS_DEPLOY_PATH }}/deploy/vps"

          case "$ACTION" in
            start)
              ssh -o BatchMode=yes "$TARGET" "cd $VPS_DIR && docker compose -p wow-backend-vps up -d"
              ssh -o BatchMode=yes "$TARGET" "cd $VPS_DIR && for i in \$(seq 1 30); do curl -sf http://127.0.0.1:3000/health-check >/dev/null 2>&1 && exit 0; sleep 3; done; echo 'API nao respondeu em 90s'; exit 1"
              ;;
            stop)
              ssh -o BatchMode=yes "$TARGET" "cd $VPS_DIR && docker compose -p wow-backend-vps stop"
              ;;
            status)
              ssh -o BatchMode=yes "$TARGET" "cd $VPS_DIR && docker compose -p wow-backend-vps ps"
              ;;
          esac
