apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-backend
  namespace: wow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wow-backend
  template:
    metadata:
      labels:
        app: wow-backend
    spec:
      containers:
        - name: wow-backend
          image: wow-server-backend:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: RUST_LOG
            - name: AZEROTH_CORE_MYSQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wow-backend-secrets
                  key: AZEROTH_CORE_MYSQL_DATABASE_URL
            - name: AZEROTH_CORE_AUTH_DB
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: AZEROTH_CORE_AUTH_DB
            - name: AZEROTH_CORE_CHARACTERS_DB
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: AZEROTH_CORE_CHARACTERS_DB
            - name: AZEROTH_CORE_WORLD_DB
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: AZEROTH_CORE_WORLD_DB
            # Generated by CloudNativePG in secret wow-app-pg-app (key: uri)
            - name: APP_POSTGRES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wow-app-pg-app
                  key: uri
            - name: JWT_PRIVATE_KEY_PATH
              value: /var/run/secrets/wow-backend/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /var/run/secrets/wow-backend/jwt_public.pem
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: JWT_AUDIENCE
            - name: JWT_EXPIRES_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: JWT_EXPIRES_MINUTES
            - name: JWT_REFRESH_EXPIRES_DAYS
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: JWT_REFRESH_EXPIRES_DAYS
            - name: SRP6_CORE5_MODE
              valueFrom:
                configMapKeyRef:
                  name: wow-backend-config
                  key: SRP6_CORE5_MODE
          volumeMounts:
            - name: wow-backend-jwt
              mountPath: /var/run/secrets/wow-backend
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health-check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health-check
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: wow-backend-jwt
          secret:
            secretName: wow-backend-secrets
            items:
              - key: jwt_private.pem
                path: jwt_private.pem
              - key: jwt_public.pem
                path: jwt_public.pem
