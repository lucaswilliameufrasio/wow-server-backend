apiVersion: v1
kind: Secret
metadata:
  name: wow-backend-secrets
  namespace: wow-backend
type: Opaque
stringData:
  # AzerothCore MySQL endpoint (include database host/port and credentials)
  AZEROTH_CORE_MYSQL_DATABASE_URL: mysql://root:password@ac-database:3306
  # JWT private key in PEM format
  jwt_private.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
  # JWT public key in PEM format
  jwt_public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
---
# CloudNativePG app-user secret (used by bootstrap.initdb.secret above)
# Apply once before the Cluster, or let your secret manager generate this.
apiVersion: v1
kind: Secret
metadata:
  name: wow-app-pg-app-user
  namespace: wow-backend
type: kubernetes.io/basic-auth
stringData:
  username: wow_app_user
  password: CHANGE_ME_STRONG_PASSWORD
---
# CloudNativePG superuser secret
apiVersion: v1
kind: Secret
metadata:
  name: wow-app-pg-superuser
  namespace: wow-backend
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: CHANGE_ME_STRONG_SUPERUSER_PASSWORD
